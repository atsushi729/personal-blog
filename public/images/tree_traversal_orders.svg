<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Tree Traversal Orders: Pre-Order, In-Order, Post-Order</title>
  <desc>Comparison of three binary tree traversal methods with diagrams and pseudocode.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- PRE-ORDER -->
  <text x="113" y="22" text-anchor="middle" fill="rgb(20,20,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">Pre-Order</text>
  <text x="113" y="38" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">root &#x2192; left &#x2192; right</text>

  <polygon points="113,55 55,130 171,130" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="1.2"/>

  <circle cx="113" cy="62" r="14" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
  <text x="113" y="62" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">R</text>
  <text x="133" y="55" fill="rgb(127,119,221)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2460;</text>

  <circle cx="72" cy="123" r="14" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.5"/>
  <text x="72" y="123" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">L</text>
  <text x="52" y="115" fill="rgb(29,158,117)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2461;</text>

  <circle cx="154" cy="123" r="14" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
  <text x="154" y="123" text-anchor="middle" dominant-baseline="central" fill="rgb(113,43,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">R</text>
  <text x="172" y="115" fill="rgb(216,90,48)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2462;</text>

  <path d="M105,73 Q88,93 80,111" fill="none" stroke="rgb(127,119,221)" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M86,117 Q120,105 140,113" fill="none" stroke="rgb(29,158,117)" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="16" y="148" width="194" height="115" rx="6" fill="rgb(245,244,237)" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text x="113" y="167" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-weight="500" font-family="monospace">function pre-order(T)</text>
  <text x="113" y="186" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">if !ISEMPTY(T) then</text>
  <rect x="60" y="193" width="106" height="18" rx="3" fill="rgb(232,89,60)" opacity="0.18"/>
  <text x="113" y="206" text-anchor="middle" fill="rgb(216,90,48)" font-size="12" font-weight="500" font-family="monospace">&#x2460; visit(root(T))</text>
  <text x="113" y="222" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">pre-order(left(T))</text>
  <text x="113" y="238" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">pre-order(right(T))</text>
  <text x="113" y="254" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">end if / end function</text>

  <!-- IN-ORDER -->
  <text x="340" y="22" text-anchor="middle" fill="rgb(20,20,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">In-Order</text>
  <text x="340" y="38" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">left &#x2192; root &#x2192; right</text>

  <polygon points="340,55 282,130 398,130" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="1.2"/>

  <circle cx="340" cy="62" r="14" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">R</text>
  <text x="360" y="55" fill="rgb(127,119,221)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2461;</text>

  <circle cx="299" cy="123" r="14" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.5"/>
  <text x="299" y="123" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">L</text>
  <text x="279" y="115" fill="rgb(29,158,117)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2460;</text>

  <circle cx="381" cy="123" r="14" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
  <text x="381" y="123" text-anchor="middle" dominant-baseline="central" fill="rgb(113,43,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">R</text>
  <text x="399" y="115" fill="rgb(216,90,48)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2462;</text>

  <path d="M307,113 Q320,93 332,75" fill="none" stroke="rgb(29,158,117)" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M352,73 Q366,93 373,111" fill="none" stroke="rgb(127,119,221)" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="243" y="148" width="194" height="115" rx="6" fill="rgb(245,244,237)" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text x="340" y="167" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-weight="500" font-family="monospace">function in-order(T)</text>
  <text x="340" y="186" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">if !ISEMPTY(T) then</text>
  <text x="340" y="202" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">in-order(left(T))</text>
  <rect x="287" y="209" width="106" height="18" rx="3" fill="rgb(232,89,60)" opacity="0.18"/>
  <text x="340" y="222" text-anchor="middle" fill="rgb(216,90,48)" font-size="12" font-weight="500" font-family="monospace">&#x2461; visit(root(T))</text>
  <text x="340" y="238" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">in-order(right(T))</text>
  <text x="340" y="254" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">end if / end function</text>

  <!-- POST-ORDER -->
  <text x="567" y="22" text-anchor="middle" fill="rgb(20,20,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">Post-Order</text>
  <text x="567" y="38" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">left &#x2192; right &#x2192; root</text>

  <polygon points="567,55 509,130 625,130" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="1.2"/>

  <circle cx="567" cy="62" r="14" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
  <text x="567" y="62" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">R</text>
  <text x="587" y="55" fill="rgb(127,119,221)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2462;</text>

  <circle cx="526" cy="123" r="14" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.5"/>
  <text x="526" y="123" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">L</text>
  <text x="506" y="115" fill="rgb(29,158,117)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2460;</text>

  <circle cx="608" cy="123" r="14" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
  <text x="608" y="123" text-anchor="middle" dominant-baseline="central" fill="rgb(113,43,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">R</text>
  <text x="626" y="115" fill="rgb(216,90,48)" font-size="12" font-family="-apple-system, system-ui, sans-serif">&#x2461;</text>

  <path d="M540,117 Q574,105 594,113" fill="none" stroke="rgb(29,158,117)" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600,111 Q588,90 577,76" fill="none" stroke="rgb(216,90,48)" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="470" y="148" width="194" height="115" rx="6" fill="rgb(245,244,237)" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text x="567" y="167" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-weight="500" font-family="monospace">function post-order(T)</text>
  <text x="567" y="186" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">if !ISEMPTY(T) then</text>
  <text x="567" y="202" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">post-order(left(T))</text>
  <text x="567" y="218" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">post-order(right(T))</text>
  <rect x="514" y="225" width="106" height="18" rx="3" fill="rgb(232,89,60)" opacity="0.18"/>
  <text x="567" y="238" text-anchor="middle" fill="rgb(216,90,48)" font-size="12" font-weight="500" font-family="monospace">&#x2462; visit(root(T))</text>
  <text x="567" y="254" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="monospace">end if / end function</text>

  <!-- Divider -->
  <rect x="16" y="280" width="648" height="1" fill="rgba(31,30,29,0.15)"/>
  <text x="340" y="300" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Traversal order comparison on the same tree</text>

  <!-- Legend -->
  <circle cx="60" cy="320" r="7" fill="rgb(127,119,221)"/>
  <text x="74" y="324" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Root node</text>
  <circle cx="200" cy="320" r="7" fill="rgb(29,158,117)"/>
  <text x="214" y="324" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Left subtree</text>
  <circle cx="360" cy="320" r="7" fill="rgb(216,90,48)"/>
  <text x="374" y="324" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Right subtree</text>
  <rect x="510" y="313" width="12" height="12" rx="3" fill="rgb(232,89,60)" opacity="0.4"/>
  <text x="528" y="324" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">visit( ) call</text>

  <!-- Example table -->
  <rect x="16" y="344" width="648" height="130" rx="8" fill="rgb(245,244,237)" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text x="340" y="366" text-anchor="middle" fill="rgb(20,20,19)" font-size="14" font-weight="500" font-family="-apple-system, system-ui, sans-serif">Example: root = A, left = B, right = C</text>

  <text x="113" y="386" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-weight="500" font-family="-apple-system, system-ui, sans-serif">Method</text>
  <text x="340" y="386" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-weight="500" font-family="-apple-system, system-ui, sans-serif">Visit order</text>
  <text x="567" y="386" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-weight="500" font-family="-apple-system, system-ui, sans-serif">Common use case</text>
  <line x1="16" y1="393" x2="664" y2="393" stroke="rgba(31,30,29,0.15)" stroke-width="0.5"/>

  <text x="113" y="413" text-anchor="middle" fill="rgb(127,119,221)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Pre-Order</text>
  <text x="340" y="413" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">A &#x2192; B &#x2192; C</text>
  <text x="567" y="413" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Tree copy / serialization</text>
  <line x1="16" y1="420" x2="664" y2="420" stroke="rgba(31,30,29,0.15)" stroke-width="0.5"/>

  <text x="113" y="440" text-anchor="middle" fill="rgb(29,158,117)" font-size="12" font-family="-apple-system, system-ui, sans-serif">In-Order</text>
  <text x="340" y="440" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">B &#x2192; A &#x2192; C</text>
  <text x="567" y="440" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Sorted output from BST</text>
  <line x1="16" y1="447" x2="664" y2="447" stroke="rgba(31,30,29,0.15)" stroke-width="0.5"/>

  <text x="113" y="467" text-anchor="middle" fill="rgb(216,90,48)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Post-Order</text>
  <text x="340" y="467" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">B &#x2192; C &#x2192; A</text>
  <text x="567" y="467" text-anchor="middle" fill="rgb(61,61,58)" font-size="12" font-family="-apple-system, system-ui, sans-serif">Memory free / dependency resolve</text>
</svg>
